<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f5d50">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BookScan">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>BookScan</title>
<style>
  :root { --bg:#faf8f4; --fg:#222; --muted:#777; --card:#fff; --line:#e4e0d8; --accent:#2f5d50; --danger:#b33;
          --top:env(safe-area-inset-top); --bot:env(safe-area-inset-bottom); }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141414; --fg:#eee; --muted:#9a9a9a; --card:#212121; --line:#333; --accent:#6fb59f; --danger:#e86; }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; }
  body { font:16px/1.4 system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--fg); overscroll-behavior-y:none; }
  button { font:inherit; border:0; border-radius:12px; min-height:48px; padding:0 18px; background:var(--accent); color:var(--bg); cursor:pointer; }
  button.ghost { background:transparent; color:var(--accent); border:1px solid var(--line); }
  button.danger { background:transparent; color:var(--danger); border:1px solid var(--line); }
  input, textarea { font:inherit; width:100%; min-height:48px; padding:10px 12px; border:1px solid var(--line); border-radius:12px; background:var(--card); color:var(--fg); }
  textarea { min-height:84px; resize:vertical; }
  label { display:block; font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:12px 0 4px; }

  header { position:sticky; top:0; z-index:5; background:var(--bg); padding:calc(var(--top) + 10px) 14px 10px; border-bottom:1px solid var(--line); }
  .bar { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .bar h1 { flex:1; font-size:20px; margin:0; }
  .bar small { color:var(--muted); }
  .bar button { min-height:40px; padding:0 12px; }

  #list { padding:12px 14px calc(110px + var(--bot)); }
  .book { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:10px; }
  .book:active { opacity:.7; }
  .book h3 { margin:0 0 2px; font-size:16px; }
  .book .meta { color:var(--muted); font-size:14px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .chip { font-size:12px; padding:2px 9px; border-radius:99px; border:1px solid var(--line); color:var(--muted); }
  .empty { text-align:center; color:var(--muted); margin-top:64px; padding:0 24px; }

  #dock { position:fixed; left:0; right:0; bottom:0; padding:12px 14px calc(12px + var(--bot)); display:flex; gap:10px;
          background:linear-gradient(transparent, var(--bg) 35%); z-index:6; }
  #dock button { min-height:56px; font-weight:600; }
  #scanBtn { flex:1; font-size:17px; }

  #toast { position:fixed; left:14px; right:14px; bottom:calc(88px + var(--bot)); z-index:30; background:#222; color:#fff;
           padding:12px 14px; border-radius:12px; font-size:15px; opacity:0; transform:translateY(8px); transition:.2s; pointer-events:none; }
  #toast.on { opacity:1; transform:none; }
  #toast.err { background:var(--danger); }

  /* scanner overlay */
  #scanner { position:fixed; inset:0; z-index:20; background:#000; display:none; flex-direction:column; }
  #scanner.on { display:flex; }
  #reader { flex:1; min-height:0; overflow:hidden; }
  #reader video { width:100% !important; height:100% !important; object-fit:cover; }
  #scanTop { position:absolute; top:0; left:0; right:0; padding:calc(var(--top) + 12px) 14px 12px; display:flex; justify-content:space-between; align-items:center; color:#fff; z-index:2;
             background:linear-gradient(#000a, transparent); }
  #scanHint button { pointer-events:auto; }
  #scanTop button { background:#fff3; color:#fff; min-height:44px; }
  #aim { position:absolute; left:8%; right:8%; top:50%; height:26%; transform:translateY(-50%); border:2px solid #fff; border-radius:14px; box-shadow:0 0 0 100vmax #0006; z-index:1; pointer-events:none; }
  #scanHint { pointer-events:none; position:absolute; left:0; right:0; bottom:calc(24px + var(--bot)); text-align:center; color:#fff; z-index:2; padding:0 20px; text-shadow:0 1px 4px #000; }

  /* bottom sheet */
  #sheetBg { position:fixed; inset:0; z-index:40; background:#0007; display:none; }
  #sheetBg.on { display:block; }
  #sheet { position:absolute; left:0; right:0; bottom:0; max-height:92%; overflow-y:auto; background:var(--bg); border-radius:20px 20px 0 0;
           padding:16px 16px calc(16px + var(--bot)); }
  #sheet .grab { width:40px; height:4px; border-radius:2px; background:var(--line); margin:0 auto 8px; }
  #sheet .btns { display:flex; gap:10px; margin-top:18px; }
  #sheet .btns .grow { flex:1; }
  #sheet a { color:var(--accent); display:inline-block; margin-top:12px; }
</style>
</head>
<body>
<header>
  <div class="bar"><h1>📚 BookScan</h1><small id="count"></small><button class="ghost" id="syncBtn" aria-label="Sync settings">☁︎</button><button class="ghost" id="csvBtn">Export</button></div>
  <input id="filter" type="search" placeholder="Search your books" enterkeyhint="search">
</header>

<div id="list"></div>

<div id="dock">
  <button class="ghost" id="typeBtn" aria-label="Enter ISBN manually">⌨︎</button>
  <button id="scanBtn">📷 Scan books</button>
</div>

<div id="scanner">
  <div id="scanTop"><strong id="scanCount">0 added</strong><button id="scanDone">Done</button></div>
  <div id="reader"><video id="cam" playsinline muted autoplay></video></div>
  <div id="aim"></div>
  <div id="scanHint">Hold the barcode inside the box and keep it steady. Scans keep running — tap Done when finished.<br><button id="photoBtn" type="button" style="margin-top:10px;background:#fff3;color:#fff;min-height:44px">Not reading? Take a photo instead</button><input id="photoIn" type="file" accept="image/*" capture="environment" hidden></div>
</div>

<div id="sheetBg"><div id="sheet"></div></div>
<div id="toast"></div>

<script src="zxing.js"></script>
<script>
const AMAZON_DOMAIN = 'www.amazon.co.uk';
const FIELDS = [['title','Title'],['author','Author'],['published','Original publication'],['category','Main category'],['subcategory','Sub category'],['tags','Tags (separate with ;)']];

// ---------- storage (IndexedDB) ----------
const db = new Promise((res, rej) => {
  const r = indexedDB.open('bookscan', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('books', { keyPath: 'isbn' });
  r.onsuccess = () => res(r.result);
  r.onerror = () => rej(r.error);
});
async function store(mode, fn) {
  const d = await db;
  return new Promise((res, rej) => {
    const t = d.transaction('books', mode), req = fn(t.objectStore('books'));
    t.oncomplete = () => res(req && req.result);
    t.onerror = () => rej(t.error);
  });
}
const allBooks = () => store('readonly', s => s.getAll());
const putBook = b => store('readwrite', s => s.put(b));
const getBook = i => store('readonly', s => s.get(i));
const delBook = i => store('readwrite', s => s.delete(i));


const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---------- Google Sheets sync ----------
// Every change is queued locally, then pushed to the Apps Script web app (see apps-script/Code.gs).
const cfg = () => { try { return JSON.parse(localStorage.getItem('sheetCfg') || '{}'); } catch (_) { return {}; } };
const queue = () => { try { return JSON.parse(localStorage.getItem('syncQueue') || '[]'); } catch (_) { return []; } };
const setQueue = q => localStorage.setItem('syncQueue', JSON.stringify(q));
const BOOK_COLS = ['isbn','title','author','published','category','subcategory','tags','amazon','added'];

async function saveBook(b) { await putBook(b); setQueue([...queue(), { t:'put', book:b }]); flush(); }
async function removeBook(isbn) { await delBook(isbn); setQueue([...queue(), { t:'del', isbn }]); flush(); }

let flushing = false;
async function send() {
  const { url, key } = cfg();
  const sent = queue();
  // text/plain avoids a CORS preflight, which Apps Script can't answer
  const r = await fetch(url, { method:'POST', headers:{ 'Content-Type':'text/plain' }, body: JSON.stringify({ key, ops: sent }) });
  const text = await r.text();
  let out; try { out = JSON.parse(text); } catch (_) { throw new Error(`Google replied with a web page, not data (HTTP ${r.status}). Check the deployment is "Anyone" and the URL ends /exec.`); }
  if (!out.ok) throw new Error(out.error || 'rejected');
  setQueue(queue().slice(sent.length));
}
async function flush() {
  if (!cfg().url || flushing || !queue().length || !navigator.onLine) return syncStatus();
  flushing = true;
  try { await send(); } catch (e) { syncStatus('Sync failed: ' + e.message, true); return; }
  finally { flushing = false; }
  syncStatus();
}

async function pull() {
  const { url, key } = cfg();
  if (queue().length) await send();
  const r = await fetch(`${url}?key=${encodeURIComponent(key || '')}`);
  const text = await r.text();
  let out; try { out = JSON.parse(text); } catch (_) { throw new Error(`Google replied with a web page, not data (HTTP ${r.status}). Check the deployment is "Anyone" and the URL ends /exec.`); }
  if (!out.ok) throw new Error(out.error || 'rejected');
  for (const b of out.books) if (b.isbn) await putBook(b);   // sheet wins for books it holds
  return out.books.length;
}

function syncStatus(msg, err) {
  const el = $('syncMsg'); if (!el) return;
  const n = queue().length;
  el.textContent = msg || (cfg().url ? (n ? `${n} change${n === 1 ? '' : 's'} waiting to upload` : 'Up to date') : 'Not connected');
  el.style.color = err ? 'var(--danger)' : 'var(--muted)';
}

function openSync() {
  const c = cfg();
  $('sheet').innerHTML = `<div class="grab"></div>
    <h3 style="margin:4px 0">Google Sheets backup</h3>
    <div id="syncMsg" style="font-size:14px"></div>
    <label>Web app URL</label><input id="sUrl" value="${esc(c.url || '')}" placeholder="https://script.google.com/macros/s/…/exec" autocapitalize="off" autocorrect="off">
    <label>Secret key</label><input id="sKey" value="${esc(c.key || '')}" autocapitalize="off" autocorrect="off">
    <label>Google Books API key (optional — fixes "HTTP 429" lookups)</label><input id="sG" value="${esc(c.gkey || '')}" autocapitalize="off" autocorrect="off">
    <div class="btns"><button class="ghost grow" id="sSave">Save</button><button class="grow" id="sSync">Sync now</button></div>`;
  $('sheetBg').classList.add('on');
  syncStatus();
  const save = () => localStorage.setItem('sheetCfg', JSON.stringify({ url: $('sUrl').value.trim(), key: $('sKey').value.trim(), gkey: $('sG').value.trim() }));
  $('sSave').onclick = () => { save(); syncStatus(); };
  $('sSync').onclick = async () => {
    save();
    if (!cfg().url) return syncStatus('Paste the web app URL first', true);
    syncStatus('Syncing…');
    try {
      // first-time connect: upload everything already on this phone
      if (!localStorage.getItem('sheetSeeded')) {
        setQueue([...queue(), ...(await allBooks()).map(book => ({ t:'put', book }))]);
        await send();
        localStorage.setItem('sheetSeeded', '1');
      }
      const n = await pull(); render();
      syncStatus(`Done — ${n} books in the sheet`);
    } catch (e) { syncStatus('Sync failed: ' + e.message, true); }
  };
}
$('syncBtn').onclick = openSync;
window.addEventListener('online', flush);

// ---------- ISBN helpers ----------
const clean = s => s.replace(/[^0-9Xx]/g, '').toUpperCase();
function isbn13Valid(s) {
  if (!/^\d{13}$/.test(s)) return false;
  return [...s].reduce((a, c, i) => a + +c * (i % 2 ? 3 : 1), 0) % 10 === 0;
}
function isbn10Valid(s) {
  if (!/^\d{9}[\dX]$/.test(s)) return false;
  return [...s].reduce((a, c, i) => a + (c === 'X' ? 10 : +c) * (10 - i), 0) % 11 === 0;
}
function to13(s) {
  if (s.length === 13) return s;
  const b = '978' + s.slice(0, 9);
  const sum = [...b].reduce((a, c, i) => a + +c * (i % 2 ? 3 : 1), 0);
  return b + ((10 - sum % 10) % 10);
}
function to10(s13) {
  if (!s13.startsWith('978')) return null;
  const b = s13.slice(3, 12);
  const c = (11 - [...b].reduce((a, ch, i) => a + +ch * (10 - i), 0) % 11) % 11;
  return b + (c === 10 ? 'X' : c);
}
const amazonUrl = i13 => to10(i13) ? `https://${AMAZON_DOMAIN}/dp/${to10(i13)}` : `https://${AMAZON_DOMAIN}/s?k=${i13}`;

// ---------- lookup ----------
// Three sources are tried in parallel. Failures are reported (never silently treated as "not found").
async function getJson(name, url) {
  for (let attempt = 0; attempt < 2; attempt++) {
    let r;
    try { r = await fetch(url, { signal: AbortSignal.timeout(8000) }); }
    catch (e) { throw new Error(`${name}: ${e.name === 'TimeoutError' ? 'timed out' : 'could not connect'}`); }
    if ((r.status === 429 || r.status >= 500) && attempt === 0) { await new Promise(res => setTimeout(res, 1500)); continue; }
    if (!r.ok) throw new Error(`${name}: HTTP ${r.status}`);
    return r.json();
  }
}
const gKey = () => cfg().gkey ? '&key=' + encodeURIComponent(cfg().gkey) : '';   // optional free API key lifts Google's shared rate limit
const year = v => (String(v || '').match(/\d{4}/) || [''])[0];

const SOURCES = [
  async isbn => {   // Open Library search: best for original publication year
    const d = await getJson('Open Library', `https://openlibrary.org/search.json?q=isbn:${isbn}&fields=title,author_name,first_publish_year,subject,ddc&limit=1`);
    const o = d.docs?.[0];
    return o && { title: o.title, authors: o.author_name || [], year: o.first_publish_year, cats: [], subjects: o.subject || [], ddc: o.ddc };
  },
  async isbn => {   // Open Library edition data: catches books the search index misses
    const d = await getJson('Open Library', `https://openlibrary.org/api/books?bibkeys=ISBN:${isbn}&jscmd=data&format=json`);
    const o = d[`ISBN:${isbn}`];
    return o && { title: [o.title, o.subtitle].filter(Boolean).join(': '), authors: (o.authors || []).map(a => a.name), year: year(o.publish_date),
                  cats: [], subjects: (o.subjects || []).map(x => x.name), ddc: o.classifications?.dewey_decimal_class };
  },
  async isbn => {   // Google Books: best for categories
    const d = await getJson('Google Books', `https://www.googleapis.com/books/v1/volumes?q=isbn:${isbn}&maxResults=1${gKey()}`);
    const g = d.items?.[0]?.volumeInfo;
    return g && gRec(g);
  },
  async isbn => {   // Google Books free-text query: finds editions the isbn: index misses, but only accepted if the ISBN matches
    const d = await getJson('Google Books', `https://www.googleapis.com/books/v1/volumes?q=${isbn}&maxResults=5${gKey()}`);
    const g = (d.items || []).map(i => i.volumeInfo).find(v => (v.industryIdentifiers || []).some(x => x.identifier === isbn));
    return g && gRec(g);
  },
  async isbn => {   // Crossref: strong for university-press and scholarly books. Every chapter shares the book's ISBN, so pick carefully.
    const d = await getJson('Crossref', `https://api.crossref.org/works?filter=isbn:${isbn}&rows=40&select=title,subtitle,author,editor,issued,subject,type,container-title`);
    const items = d.message?.items || [];
    const names = list => (list || []).map(a => [a.given, a.family].filter(Boolean).join(' ') || a.name).filter(Boolean);
    const BOOK = ['book', 'monograph', 'edited-book', 'reference-book', 'book-set', 'book-series'];
    const bk = items.find(c => BOOK.includes(c.type));
    if (bk) return { title: [bk.title?.[0], bk.subtitle?.[0]].filter(Boolean).join(': '), authors: names(bk.author?.length ? bk.author : bk.editor),
                     year: bk.issued?.['date-parts']?.[0]?.[0], cats: [], subjects: bk.subject || [] };
    // Only chapters on record: the book's title is each chapter's "container title"; chapter authors are not the book's authors
    const ch = items.find(c => c['container-title']?.[0]);
    return ch && { title: ch['container-title'][0], authors: [], year: ch.issued?.['date-parts']?.[0]?.[0], cats: [], subjects: [] };
  },
];
const gRec = g => ({ title: [g.title, g.subtitle].filter(Boolean).join(': '), authors: g.authors || [], year: year(g.publishedDate),
                     cats: (g.categories || []).flatMap(c => c.split('/').map(x => x.trim())).filter(Boolean), subjects: [] });

// Resolves to a book, or null if every source answered and none knows it. Throws if sources failed and nothing was found.
async function lookup(isbn13) {
  const res = await Promise.allSettled(SOURCES.map(f => f(isbn13)));
  const recs = res.filter(r => r.status === 'fulfilled' && r.value).map(r => r.value);
  const errs = [...new Set(res.filter(r => r.status === 'rejected').map(r => r.reason.message))];
  if (!recs.length) { if (errs.length) throw new Error(errs.join('; ')); return null; }
  return merge(isbn13, recs);
}

// Dewey Decimal: main class (hundreds) and division (tens). Used when Google Books gives no categories.
const DDC_MAIN = { 0:'Computer science, information & general works', 1:'Philosophy & psychology', 2:'Religion', 3:'Social sciences', 4:'Language',
  5:'Science', 6:'Technology', 7:'Arts & recreation', 8:'Literature', 9:'History & geography' };
const DDC_DIV = { 0:'General works',10:'Bibliography',20:'Library & information sciences',30:'Encyclopedias',50:'Serials',60:'Organizations & museums',70:'Journalism & publishing',80:'General collections',90:'Manuscripts & rare books',
  100:'Philosophy',110:'Metaphysics',120:'Epistemology',130:'Parapsychology & occultism',140:'Philosophical schools',150:'Psychology',160:'Logic',170:'Ethics',180:'Ancient, medieval & eastern philosophy',190:'Modern western philosophy',
  200:'Religion',210:'Philosophy & theory of religion',220:'Bible',230:'Christianity & Christian theology',240:'Christian practice & devotion',250:'Pastoral practice & religious orders',260:'Christian organisation & worship',270:'History of Christianity',280:'Christian denominations',290:'Other religions',
  300:'Social sciences',310:'Statistics',320:'Political science',330:'Economics',340:'Law',350:'Public administration & military',360:'Social problems & services',370:'Education',380:'Commerce & communications',390:'Customs & folklore',
  400:'Language',410:'Linguistics',420:'English',430:'German',440:'French',450:'Italian',460:'Spanish & Portuguese',470:'Latin',480:'Classical & modern Greek',490:'Other languages',
  500:'Science',510:'Mathematics',520:'Astronomy',530:'Physics',540:'Chemistry',550:'Earth sciences',560:'Palaeontology',570:'Biology',580:'Plants',590:'Animals',
  600:'Technology',610:'Medicine & health',620:'Engineering',630:'Agriculture',640:'Home & family',650:'Management',660:'Chemical engineering',670:'Manufacturing',680:'Specialised manufacturing',690:'Construction',
  700:'Arts',710:'Landscape & planning',720:'Architecture',730:'Sculpture & ceramics',740:'Drawing & decorative arts',750:'Painting',760:'Graphic arts',770:'Photography',780:'Music',790:'Sports, games & entertainment',
  800:'Literature',810:'American literature',820:'English literature',830:'German literature',840:'French literature',850:'Italian literature',860:'Spanish & Portuguese literature',870:'Latin literature',880:'Greek literature',890:'Other literatures',
  900:'History',910:'Geography & travel',920:'Biography',930:'Ancient history',940:'History of Europe',950:'History of Asia',960:'History of Africa',970:'History of North America',980:'History of South America',990:'History of other areas' };
function ddcCats(list) {
  const m = (list || []).map(d => String(d).match(/^\d{3}/)).find(Boolean);   // first usable class number, e.g. "230.092" -> 230
  if (!m) return [];
  const n = +m[0], main = DDC_MAIN[Math.floor(n / 100)], div = DDC_DIV[Math.floor(n / 10) * 10];
  return [main, div && div !== main ? div : ''].filter(Boolean);
}
// drop Open Library bookkeeping tags such as "series:Harry_Potter", "nyt:...", "Accessible book"
const JUNK_TAG = /^(accessible book|protected daisy|in library|lending library|overdrive|internet archive wishlist|large type books|open library staff picks|reading level-.*|general)$/i;
const goodTag = t => !/[:_]/.test(t) && !JUNK_TAG.test(t) && t.length < 60;

function merge(isbn13, recs) {
  const first = f => recs.map(f).find(v => v && String(v).length) || '';
  let cats = recs.flatMap(r => r.cats);
  if (!cats.length) cats = ddcCats(recs.flatMap(r => r.ddc || []));
  const tagSet = new Map();
  [...cats, ...recs.flatMap(r => r.subjects.slice(0, 15))].forEach(t => {
    t = String(t).replace(/;/g, ',').trim();
    if (t && goodTag(t) && !tagSet.has(t.toLowerCase())) tagSet.set(t.toLowerCase(), t);
  });
  return {
    isbn: isbn13,
    title: first(r => r.title),
    author: (recs.map(r => r.authors).find(a => a.length) || []).join(', '),
    published: String(first(r => r.year)),
    category: cats[0] || '',
    subcategory: cats.find((c, i) => i > 0 && c.toLowerCase() !== 'general') || '',
    tags: [...tagSet.values()].slice(0, 20).join(';'),
    amazon: amazonUrl(isbn13),
    added: new Date().toISOString(),
  };
}

// Title/author search, for books no ISBN database knows: user picks the right match, the ISBN stays as scanned.
async function searchTitles(q) {
  const enc = encodeURIComponent(q);
  const res = await Promise.allSettled([
    getJson('Open Library', `https://openlibrary.org/search.json?q=${enc}&limit=8&fields=title,author_name,first_publish_year,subject,ddc`)
      .then(d => (d.docs || []).map(o => ({ title: o.title, authors: o.author_name || [], year: o.first_publish_year, cats: [], subjects: o.subject || [], ddc: o.ddc }))),
    getJson('Google Books', `https://www.googleapis.com/books/v1/volumes?q=${enc}&maxResults=8&printType=books${gKey()}`)
      .then(d => (d.items || []).map(i => gRec(i.volumeInfo))),
  ]);
  const hits = res.flatMap(r => r.status === 'fulfilled' ? r.value : []);
  if (!hits.length && res.every(r => r.status === 'rejected')) throw new Error(res[0].reason.message);
  return hits.map(h => merge('', [h]));
}

// ---------- UI helpers ----------
let toastT;
function toast(msg, err) {
  const t = $('toast'); t.textContent = msg; t.className = 'on' + (err ? ' err' : '');
  clearTimeout(toastT); toastT = setTimeout(() => t.className = '', 2800);
}
const buzz = ms => navigator.vibrate && navigator.vibrate(ms);

// returns 'added' | 'dup' | 'blank' | 'invalid' | 'error'
async function handleIsbn(raw) {
  const s = clean(raw);
  if (!(isbn13Valid(s) || isbn10Valid(s))) { toast(`"${raw}" isn't a valid ISBN`, true); return 'invalid'; }
  const isbn = to13(s);
  if (await getBook(isbn)) { toast('Already in your library'); return 'dup'; }
  toast(`Looking up ${isbn}…`);
  try {
    const book = await lookup(isbn);
    if (!book) {
      await saveBook({ isbn, title:'', author:'', published:'', category:'', subcategory:'', tags:'', amazon: amazonUrl(isbn), added: new Date().toISOString() });
      toast(`No match for ${isbn} — blank row added`, true); render(); return 'blank';
    }
    await saveBook(book);
    toast(`✓ ${book.title}`); render(); return 'added';
  } catch (e) {
    await saveBook({ isbn, title:'', author:'', published:'', category:'', subcategory:'', tags:'', amazon: amazonUrl(isbn), added: new Date().toISOString() });
    toast(`Saved ${isbn} without details (${e.message}). Open it and tap Look up again later.`, true); render(); return 'blank';
  }
}

async function render() {
  const q = $('filter').value.toLowerCase();
  const books = (await allBooks()).sort((a, b) => b.added.localeCompare(a.added));
  const shown = books.filter(b => !q || JSON.stringify(b).toLowerCase().includes(q));
  $('count').textContent = books.length ? `${books.length}` : '';
  $('list').innerHTML = shown.length ? shown.map(b => `
    <div class="book" data-isbn="${b.isbn}">
      <h3>${esc(b.title) || '<i>Untitled — tap to fill in</i>'}</h3>
      <div class="meta">${esc(b.author)}${b.published ? ' · ' + esc(b.published) : ''}</div>
      <div class="meta">${[b.category, b.subcategory].filter(Boolean).map(esc).join(' › ')}</div>
      ${b.tags ? `<div class="chips">${b.tags.split(';').slice(0, 5).map(t => `<span class="chip">${esc(t)}</span>`).join('')}</div>` : ''}
    </div>`).join('')
    : `<div class="empty">${books.length ? 'No matches.' : 'No books yet.<br>Tap <b>Scan books</b> and point your camera at a barcode.'}</div>`;
}
$('filter').addEventListener('input', render);

// ---------- edit sheet ----------
async function openSheet(isbn) {
  const b = await getBook(isbn); if (!b) return;
  $('sheet').innerHTML = `<div class="grab"></div>
    ${FIELDS.map(([f, l]) => f === 'tags'
      ? `<label>${l}</label><textarea data-f="${f}">${esc(b[f])}</textarea>`
      : `<label>${l}</label><input data-f="${f}" value="${esc(b[f])}">`).join('')}
    <a href="${esc(b.amazon)}" target="_blank" rel="noopener">Open on Amazon ↗</a>
    <div class="meta" style="color:var(--muted);font-size:13px;margin-top:6px">ISBN ${b.isbn}</div>
    <button class="ghost" id="reB" style="width:100%;margin-top:14px">Look up again</button>
    <label>Not found? Search by title or author</label>
    <div style="display:flex;gap:8px"><input id="qIn" placeholder="e.g. Barth church dogmatics" enterkeyhint="search"><button id="qGo" style="min-height:48px">Search</button></div>
    <div id="qRes"></div>
    <div class="btns"><button class="danger" id="delB">Delete</button><button class="grow" id="saveB">Save</button></div>`;
  $('sheetBg').classList.add('on');
  $('saveB').onclick = async () => {
    $('sheet').querySelectorAll('[data-f]').forEach(el => b[el.dataset.f] = el.value.trim());
    await saveBook(b); closeSheet(); render();
  };
  const fillFrom = f => $('sheet').querySelectorAll('[data-f]').forEach(el => { if (f[el.dataset.f]) el.value = f[el.dataset.f]; });
  const doSearch = async () => {
    const q = $('qIn').value.trim(); if (!q) return;
    $('qRes').innerHTML = '<div class="meta" style="margin-top:8px">Searching…</div>';
    try {
      const hits = await searchTitles(q);
      window._hits = hits;
      $('qRes').innerHTML = hits.length ? hits.map((h, i) => `<div class="book" data-i="${i}" style="margin-top:8px">
          <h3>${esc(h.title)}</h3><div class="meta">${esc(h.author)}${h.published ? ' · ' + esc(h.published) : ''}</div></div>`).join('')
        : '<div class="meta" style="margin-top:8px">No results — fill the fields in by hand.</div>';
    } catch (e) { $('qRes').innerHTML = `<div class="meta" style="margin-top:8px;color:var(--danger)">${esc(e.message)}</div>`; }
  };
  $('qGo').onclick = doSearch;
  $('qIn').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
  $('qRes').onclick = e => { const c = e.target.closest('[data-i]'); if (!c) return; fillFrom(window._hits[+c.dataset.i]); toast('Filled in — check, then tap Save'); $('sheet').scrollTo({ top: 0, behavior: 'smooth' }); };
  $('reB').onclick = async () => {
    $('reB').textContent = 'Looking up…';
    try {
      const f = await lookup(isbn);
      if (!f) toast('No match found in any source', true);
      else { $('sheet').querySelectorAll('[data-f]').forEach(el => { if (!el.value.trim() && f[el.dataset.f]) el.value = f[el.dataset.f]; }); toast('Filled in — tap Save'); }
    } catch (e) { toast(e.message, true); }
    $('reB').textContent = 'Look up again';
  };
  $('delB').onclick = async () => { if (confirm('Delete this book?')) { await removeBook(isbn); closeSheet(); render(); } };
}
const closeSheet = () => $('sheetBg').classList.remove('on');
$('sheetBg').addEventListener('click', e => { if (e.target.id === 'sheetBg') closeSheet(); });
$('list').addEventListener('click', e => { const c = e.target.closest('.book'); if (c) openSheet(c.dataset.isbn); });

// ---------- manual entry ----------
$('typeBtn').onclick = () => {
  const v = prompt('Enter ISBN (10 or 13 digits)');
  if (v) handleIsbn(v);
};

// ---------- CSV export ----------
$('csvBtn').onclick = async () => {
  const cols = ['isbn', 'title', 'author', 'published', 'category', 'subcategory', 'tags', 'amazon'];
  const head = ['ISBN','Title','Author','Original publication','Main category','Sub category','Tags','Amazon link'];
  const cell = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const csv = [head, ...(await allBooks()).map(b => cols.map(c => b[c]))].map(r => r.map(cell).join(',')).join('\r\n');
  const file = new File(['﻿' + csv], 'books.csv', { type: 'text/csv' });
  if (navigator.canShare?.({ files: [file] })) {
    try { await navigator.share({ files: [file], title: 'BookScan library' }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file); a.download = 'books.csv'; a.click();
};

// ---------- scanner (continuous batch mode) ----------
// Camera frames are decoded by zxing-wasm (self-hosted), which copes with dark covers, tilt and small barcodes far better than the JS decoders.
ZXingWASM.setZXingModuleOverrides({ locateFile: f => f.endsWith('.wasm') ? 'zxing_reader.wasm' : f });
const READ_OPTS = { formats: ['EAN-13'], tryHarder: true, tryRotate: true, tryInvert: false, maxNumberOfSymbols: 1 };
const isbnFrom = res => res.map(r => (r.text.match(/97[89]\d{10}/) || [])[0]).find(c => c && isbn13Valid(c));

let stream = null, scanning = false, added = 0, busy = false;
const seen = new Map();   // code -> last time handled, to ignore repeat reads of the same barcode

async function onCode(code) {
  const now = Date.now();
  if (busy || now - (seen.get(code) || 0) < 6000) return;
  seen.set(code, now); busy = true; buzz(60);
  try { if (await handleIsbn(code) === 'added') $('scanCount').textContent = `${++added} added`; }
  finally { busy = false; }
}

async function scanLoop(video) {
  const cv = document.createElement('canvas'), cx = cv.getContext('2d', { willReadFrequently: true });
  while (scanning) {
    if (video.readyState >= 2 && video.videoWidth) {
      // full-width strip across the middle half of the frame, at the camera's native resolution
      const vw = video.videoWidth, vh = video.videoHeight, sh = Math.round(vh * 0.5), sy = Math.round((vh - sh) / 2);
      cv.width = vw; cv.height = sh;
      cx.drawImage(video, 0, sy, vw, sh, 0, 0, vw, sh);
      try {
        const code = isbnFrom(await ZXingWASM.readBarcodes(cx.getImageData(0, 0, vw, sh), READ_OPTS));
        if (code) await onCode(code);
      } catch (_) {}
    }
    await new Promise(r => setTimeout(r, 100));
  }
}

async function startScan() {
  added = 0; $('scanCount').textContent = '0 added';
  $('scanner').classList.add('on');
  try {
    // ask for a high-resolution stream: the default (~640x480) leaves a book barcode too few pixels to read
    stream = await navigator.mediaDevices.getUserMedia({ audio: false,
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } } });
    const v = $('cam'); v.srcObject = stream; await v.play();
    try { await stream.getVideoTracks()[0].applyConstraints({ advanced: [{ focusMode: 'continuous' }] }); } catch (_) {}
    scanning = true; scanLoop(v);
  } catch (e) {
    await stopScan();
    toast('Camera unavailable — allow camera access (needs HTTPS)', true);
  }
}
async function stopScan() {
  scanning = false;
  stream?.getTracks().forEach(t => t.stop()); stream = null;
  $('cam').srcObject = null; $('scanner').classList.remove('on');
}

// Photo fallback: the phone's own camera app focuses far better than a live web stream
async function readPhoto(file) {
  const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
  const k = Math.min(1, 2400 / Math.max(bmp.width, bmp.height));
  const cv = document.createElement('canvas'); cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
  const cx = cv.getContext('2d', { willReadFrequently: true }); cx.drawImage(bmp, 0, 0, cv.width, cv.height);
  return isbnFrom(await ZXingWASM.readBarcodes(cx.getImageData(0, 0, cv.width, cv.height), READ_OPTS));
}
$('photoBtn').onclick = () => $('photoIn').click();
$('photoIn').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  toast('Reading photo…');
  try { const code = await readPhoto(f); if (code) { seen.delete(code); await onCode(code); } else toast('No barcode found in the photo — try closer and sharper', true); }
  catch (err) { toast('Could not read the photo: ' + err.message, true); }
};

$('scanBtn').onclick = startScan;
$('scanDone').onclick = stopScan;

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
flush();
render();
</script>
</body>
</html>
